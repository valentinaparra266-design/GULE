<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura Restaurante</title>

    <link rel="stylesheet" href="FacturaVentas.css">
</head>
<body>

    <div class="contenedor">
        <a href="index.html" class="logo">
    <img src="imagenes/Gulepdf-1.png" alt="Logo Restaurante" width="120">
</a>

        <h1>Factura Restaurante</h1>

        <div class="cliente">
            <label>Nombre del cliente</label>
            <input type="text" id="cliente" placeholder="Ingrese nombre">

            <label>Fecha</label>
            <input type="date" id="fecha">
        </div>

        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Valor Unitario</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody>
                <!-- PRODUCTO 1 -->
                <tr>
                    <td>
                        <select id="prod1" onchange="mostrar()">
                            <option value="0">Seleccionar</option>
                            <option value="23500">Paella de Mariscos</option>
                            <option value="16000">Huevos Gourmet</option>
                            <option value="15200">Degustación Dulce y Crujiente</option>
                            <option value="19000">Filete de Res a la Parrilla</option>
                            <option value="21000">Salmón Fresco</option>
                            <option value="20000">Pasta Clásica Italiana</option>
                            <option value="18000">Salmón a la Plancha</option>
                            <option value="16000">Ensalada de Frutas</option>
                            <option value="26500">Desayuno Especial</option>
                            <option value="16300">Ensalada Mixta</option>
                            <option value="15500">Pollo al Curry con Arroz</option>
                            <option value="29500">Selección de Sushi</option>
                        </select>
                    </td>

                    <td>
                        <input type="number" id="cant1" value="1" min="1" onchange="mostrar()">
                    </td>

                    <td>
                        <input type="text" id="valor1" readonly>
                    </td>

                    <td>
                        <input type="text" id="total1" readonly>
                    </td>
                </tr>

                <!-- PRODUCTO 2 -->
                <tr>
                    <td>
                        <select id="prod2" onchange="mostrar()">
                            <option value="0">Seleccionar</option>
                            <option value="23500">Paella de Mariscos</option>
                            <option value="16000">Huevos Gourmet</option>
                            <option value="15200">Degustación Dulce y Crujiente</option>
                            <option value="19000">Filete de Res a la Parrilla</option>
                            <option value="21000">Salmón Fresco</option>
                            <option value="20000">Pasta Clásica Italiana</option>
                            <option value="18000">Salmón a la Plancha</option>
                            <option value="16000">Ensalada de Frutas</option>
                            <option value="26500">Desayuno Especial</option>
                            <option value="16300">Ensalada Mixta</option>
                            <option value="15500">Pollo al Curry con Arroz</option>
                            <option value="29500">Selección de Sushi</option>
                        </select>
                    </td>

                    <td>
                        <input type="number" id="cant2" value="1" min="1" onchange="mostrar()">
                    </td>

                    <td>
                        <input type="text" id="valor2" readonly>
                    </td>

                    <td>
                        <input type="text" id="total2" readonly>
                    </td>
                </tr>

                <!-- PRODUCTO 3 -->
                <tr>
                    <td>
                        <select id="prod3" onchange="mostrar()">
                            <option value="0">Seleccionar</option>
                            <option value="23500">Paella de Mariscos</option>
                            <option value="16000">Huevos Gourmet</option>
                            <option value="15200">Degustación Dulce y Crujiente</option>
                            <option value="19000">Filete de Res a la Parrilla</option>
                            <option value="21000">Salmón Fresco</option>
                            <option value="20000">Pasta Clásica Italiana</option>
                            <option value="18000">Salmón a la Plancha</option>
                            <option value="16000">Ensalada de Frutas</option>
                            <option value="26500">Desayuno Especial</option>
                            <option value="16300">Ensalada Mixta</option>
                            <option value="15500">Pollo al Curry con Arroz</option>
                            <option value="29500">Selección de Sushi</option>
                        </select>
                    </td>

                    <td>
                        <input type="number" id="cant3" value="1" min="1" onchange="mostrar()">
                    </td>

                    <td>
                        <input type="text" id="valor3" readonly>
                    </td>

                    <td>
                        <input type="text" id="total3" readonly>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="totales">
            <div class="adicionales">

<div class="adicionales">

    <h3>Adicionales</h3>

    <label>
        <input type="checkbox" id="adic1" onchange="mostrar()">
        <img src="imagenes/7707133062471.png" width="40"> Bebida + $3.000
    </label>

    <label>
        <input type="checkbox" id="adic2" onchange="mostrar()">
        <img src="imagenes/cheecake_horneado_v1_transparent.png" width="40"> Postre + $2.500
    </label>

    <label>
        <input type="checkbox" id="adic3" onchange="mostrar()">
        <img src="imagenes/image_1024.png" width="40"> Papas Extra + $4.000
    </label>
</div>
<div class="pago">

    <h3>Método de pago</h3>

    <label>
        <input type="radio" name="pago" id="nequi" checked>
        <img src="imagenes/recarga-claro.png" width="40"> Nequi
    </label>

    <label>
        <input type="radio" name="pago" id="daviplata">
        <img src="imagenes/images (1).png" width="40">Daviplata
    </label>

    <label>
        <input type="radio" name="pago" id="efectivo">
        <img src="imagenes/pngtree-cash-paper-banknote-money-cash-heap-pile-and-stack-money-png-image_12192877.png" width="40"> Nequi
        Efectivo
    </label>

</div>
            <label>Subtotal</label>
            <input type="text" id="subtotal" readonly>

            <label>IVA (19%)</label>
            <input type="text" id="iva" readonly>

            <label>Total Neto</label>
            <input type="text" id="neto" readonly>
        </div>

        <button onclick="enviar()">Generar Pedido</button>

    </div>

    <script src="factira.js"></script>

</body>
</html>
